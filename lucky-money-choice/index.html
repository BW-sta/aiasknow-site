<body>
<div class="app">

<script>
(()=>{const $=s=>document.querySelector(s),money=n=>"¥"+Math.max(0,Math.round(n)).toLocaleString("zh-CN"),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));let run=1,st=null;const pct=(b,p,min,max)=>Math.round(clamp(b*p,min,max));function spend(cat,amt,label){amt=Math.round(amt);if(amt>st.cash)return false;st.cash-=amt;st.spent[cat]=(st.spent[cat]||0)+amt;if(amt>0)st.history.push({label,amt});return true}const has=k=>st.flags[k],remember=k=>st.flags[k]=true;
function makeEvents(){const B=st.start,v=run%2===0;return[
{m:"春节",e:"🧧",s:["🏮","✨"],t:"第一笔压岁钱到手了",d:`你今年一共有 ${money(B)}。商场里那双你喜欢很久的鞋正在做新年活动。`,c:()=>[{t:"现在就买",p:pct(B,.16,99,699),cat:"things",k:"shoes",r:"新鞋到手。你一路都在低头看它。"},{t:"先等等",p:0,k:"waitShoes",r:"你把页面关掉了。钱一分没动。"},{t:"买双便宜的",p:pct(B,.06,49,299),cat:"things",k:"basicShoes",r:"没有最喜欢的那双，但也挺舒服。"}]},
{m:"二月",e:"🥤",s:["👫","🌇"],t:"放学后，朋友叫你一起喝点东西",d:"大家准备在回家前坐一会儿。你其实不太渴，但今天聊得正开心。",c:()=>[{t:"一起喝一杯",p:clamp(Math.round(B*.008),12,28),cat:"exp",k:"milkTea",r:"你们坐了四十分钟，聊到一件后来很好笑的事。"},{t:"买最便宜的",p:clamp(Math.round(B*.004),6,15),cat:"exp",k:"milkCheap",r:"你也坐下来了，杯子里是什么反而没那么重要。"},{t:"今天不喝",p:0,k:"skipMilk",r:"你提前回家了。今天很普通，也很安静。"}]},
{m:"三月",e:"🎮",s:["🔥","🎟️"],t:"你常玩的游戏出了限定皮肤",d:"倒计时只剩两天。班里已经有人买了，但你也不知道自己这个游戏还会玩多久。",c:()=>[{t:"买下来",p:clamp(Math.round(B*.022),28,88),cat:"things",k:"skin",r:"刚换上的那几天，你每次打开游戏都会看两眼。"},{t:"等最后一天",p:0,k:"skinWait",r:"你把购买页面留着，没有马上决定。"},{t:"不买",p:0,k:"noSkin",r:"倒计时还在跳，你退出了页面。"}]},

{m:"六月",e:"🎧",s:["⚡","🏷️"],t:"喜欢的耳机突然打折",d:"原价比现在贵不少。你手里的耳机还能用，只是已经有点旧了。",cb:()=>has("shoes")?"还记得春节买的鞋吗？你已经穿了四个月，鞋底真的有点磨了。":has("waitShoes")?(v?"春节那双鞋后来恢复原价了。":"春节那双鞋后来又便宜了一次，不过你已经没那么想要了。"):"",c:()=>[{t:"趁打折买",p:pct(B,.12,99,499),cat:"things",k:"headphones",r:"新耳机隔音很好，你回家的路上连续听了三首歌。"},{t:"旧的继续用",p:0,k:"oldHeadphones",r:"旧耳机继续塞在书包侧袋里。"},{t:"买个便宜款",p:pct(B,.045,39,188),cat:"things",k:"cheapHeadphones",r:"音质没有惊喜，但日常用完全够。"}]},
{m:"暑假",e:"🏕️",s:["🌊","🚌"],t:"暑假突然来了一个你很想去的活动",d:"三天两夜，有露营、夜观和漂流。报名今晚截止。",cb:()=>has("skin")?(v?"三月买的皮肤你最近还在用，朋友也会认出它。":"三月买的皮肤，你已经快一个月没换上了。"):has("noSkin")?"三月没买的那款皮肤已经下架了。你偶尔会想起，但也就一会儿。":"",c:()=>{const x=pct(B,.34,180,1180);return[{t:"报名去",p:x,cat:"exp",k:"camp",r:"三天回来以后，你的鞋里全是沙，手机里多了很多奇怪照片。"},{t:"找个便宜的一日活动",p:pct(B,.12,68,420),cat:"exp",k:"dayTrip",r:"一天很快结束，但你回来的时候已经晒黑了一点。"},{t:"这次不去",p:0,k:"skipCamp",r:"报名页面关掉了。群里后来一直在讨论那次活动。"}]}},
{m:"九月",e:"🏆",s:["🤖","📣"],t:"开学后，一条消息找到你",d:()=>has("robot")?"机器人老师说，市里有个小比赛，之前参加过小组的人可以组队报名。":has("robotTrial")?"机器人老师说还有两个补位名额，但需要这周加练一次。":"同学说机器人小组准备去参加比赛。你没参加前面的项目，所以这次只能去现场看看。",cb:()=>has("robot")?"四月那个总是跑偏的小车，居然又回来了。":has("robotTrial")?"四月那节体验课，今天突然有了后续。":"四月没参加的那个小组，今天又出现在你的生活里。",c:()=>has("robot")||has("robotTrial")?[{t:"报名比赛",p:pct(B,.035,25,150),cat:"learn",k:"contest",r:"你们第一次测试就撞到了桌腿，但最后还是报名了。"},{t:"去帮忙但不参赛",p:0,k:"watchContest",r:"你帮他们拍了比赛视频，还认识了另一个学校的人。"},{t:"这次算了",p:0,k:"skipContest",r:"比赛那天你在家做别的事。晚上刷到了他们的照片。"}]:[{t:"去现场看看",p:clamp(Math.round(B*.006),8,30),cat:"exp",k:"visitContest",r:"你在展台前站了很久，还问了三个问题。"},{t:"不去了",p:0,k:"skipContest",r:"那周末很快过去了。"}]},
{m:"十月",e:"📦",s:["🎧","🍂"],t:"有些东西，过几个月才知道值不值",d:"十月的一天，你整理书桌，翻到了今年买过的一些东西。",cb:()=>[has("headphones")?"六月的耳机现在还经常在用。":"",has("skin")?(v?"游戏皮肤最近因为新活动又重新用上了。":"游戏皮肤已经很少出现了。"):
"",has("bigGift")?"朋友生日那份礼物，现在还摆在他房间里。":""].filter(Boolean).join(" "),c:()=>[{t:"什么都不处理",p:0,k:"keepStuff",r:"桌面整理干净了，生活继续。"},{t:"把不用的东西转给别人",p:0,k:"shareStuff",r:"有件闲置的小东西到了别人手里，对方还挺喜欢。"},{t:"列一张“以后再买”清单",p:0,k:"wishlist",r:"清单上有三样东西，一周后你自己删掉了一样。"}]},
{m:"十一月",e:"🧪",s:["🏫","⚠️"],t:"学校临时通知：下周要带实验材料",d:"家里没有现成的。附近店今天有货，周末会不会涨价没人知道。",cb:()=>has("camp")?"暑假那次活动以后，你还剩的钱明显少了一截。现在每一笔都会更有感觉。":has("skipCamp")?"暑假没去活动留下的钱，现在还安静地待在余额里。":"",c:()=>[{t:"今天直接买齐",p:pct(B,.025,20,110),cat:"learn",k:"materials",r:"材料放进书包，事情立刻少了一件。"},{t:"和同学合买",p:pct(B,.012,10,55),cat:"learn",k:"shareMaterials",r:"你们分好了材料，顺便约好一起做。"},{t:"回家找替代材料",p:clamp(Math.round(B*.003),3,15),cat:"learn",k:"diyMaterials",r:"最后真凑出来了，不过桌上像刮过一场风。"}]},

function init(a){a=clamp(parseInt(a)||3000,100,50000);st={start:a,cash:a,flags:{},history:[],spent:{things:0,exp:0,learn:0,gift:0},idx:0};st.events=makeEvents();$("#startScreen").classList.add("hidden");$("#yearEnd").classList.add("hidden");$("#gameScreen").classList.remove("hidden");$("#runCount").textContent=`第${run}年`;render()}
function render(){const e=st.events[st.idx];if(!e)return endYear();$("#month").textContent=e.m;$("#cash").textContent=money(st.cash);$("#bar").style.width=((st.idx+1)/st.events.length*100)+"%";$("#emoji").textContent=e.e;$("#sideA").textContent=e.s[0];$("#sideB").textContent=e.s[1];$("#kicker").textContent=`${e.m} · 这一年的第 ${st.idx+1} 件事`;$("#title").textContent=e.t;$("#desc").textContent=typeof e.d==="function"?e.d():e.d;const cb=e.cb?e.cb():"";$("#callback").textContent=cb;$("#callback").classList.toggle("hidden",!cb);$("#resultLine").classList.add("hidden");const w=$("#choices");w.innerHTML="";e.c().forEach(c=>{const b=document.createElement("button");b.className="choice";b.innerHTML=`<div><div class="main">${c.t}</div></div><div class="price">${c.p?money(c.p):"¥0"}</div>`;b.onclick=()=>choose(c,e);w.appendChild(b)});scrollTo({top:0,behavior:"smooth"})}
function choose(c,e){if(c.p>st.cash){const last=st.history.slice(-5);$("#resultLine").className="resultline shortage";$("#resultLine").innerHTML=`<b>现在还差 ${money(c.p-st.cash)}</b><br>这次真的不够了。<div class="review">${last.length?last.map(x=>`<div><span>${x.label}</span><b>-${money(x.amt)}</b></div>`).join(""):"<div><span>前面几乎没花钱</span><b>¥0</b></div>"}</div>`;$("#resultLine").classList.remove("hidden");return}if(c.p)spend(c.cat||"things",c.p,e.t+" · "+c.t);if(c.k)remember(c.k);$("#cash").textContent=money(st.cash);$("#choices").innerHTML="";$("#resultLine").className="resultline";$("#resultLine").innerHTML=`${c.r}<br><b>还剩 ${money(st.cash)}</b>`;$("#resultLine").classList.remove("hidden");setTimeout(()=>{st.idx++;render()},700)}
function endYear(){$("#gameScreen").classList.add("hidden");$("#yearEnd").classList.remove("hidden");$("#sumStart").textContent=money(st.start);$("#sumCash").textContent=money(st.cash);$("#sumThings").textContent=money(st.spent.things);$("#sumExp").textContent=money(st.spent.exp);$("#sumLearn").textContent=money(st.spent.learn);$("#sumGift").textContent=money(st.spent.gift);$("#endLead").textContent=`你从 ${money(st.start)} 开始，最后留下了 ${money(st.cash)}。有些钱变成了东西，有些变成经历。`;const a=[];if(has("robot")||has("contest"))a.push("🤖 春天参加的机器人活动，在开学后真的又找到了你。");if(has("camp"))a.push("🏕️ 暑假那次活动花掉不少钱，也留下了一整段经历。");if(has("skipCamp"))a.push("🌿 暑假你没有去那次活动，钱留了下来，也错过了一段只有那几天才有的事情。");if(has("headphones"))a.push("🎧 六月买的耳机到了年底仍然是你常用的东西之一。");if(has("skin"))a.push(run%2===0?"🎮 三月的游戏皮肤后来又重新用上了。":"🎮 三月的游戏皮肤后来慢慢很少出现了。");$("#storyList").innerHTML=(a.length?a:["🧧 这一年你做了很多选择，最后保留了相当多的余额。"] ).slice(0,4).map(x=>`<div class="storyitem">${x}</div>`).join("");$("#endQuote").textContent=st.cash>st.start*.72?"你留下了很多钱。明年再遇到真正重要的事，你还有很多选择。":"有些钱留下来了，有些钱变成了一段经历。这一年，是你自己选的。";scrollTo(0,0)}
document.querySelectorAll("[data-money]").forEach(b=>b.onclick=()=>$("#amount").value=b.dataset.money);$("#startBtn").onclick=()=>init($("#amount").value);$("#replayBtn").onclick=()=>{run++;init(st.start)};$("#homeBtn").onclick=()=>{run=1;$("#yearEnd").classList.add("hidden");$("#startScreen").classList.remove("hidden");scrollTo(0,0)};
})();
</script>
</body></html>
