name: Initialize Suolema Analytics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize analytics key and counters
        shell: bash
        run: |
          set -euo pipefail

          if [ -f suolema/analytics-config.js ]; then
            APP_KEY="$(grep 'appKey:' suolema/analytics-config.js | sed -E 's/.*appKey: "([^"]+)".*/\1/')"
          else
            APP_KEY="$(curl -fsSL --retry 3 --retry-delay 2 https://keyvalue.immanuel.co/api/KeyVal/GetAppKey | tr -d '"\r\n ')"
            test -n "$APP_KEY"
            cat > suolema/analytics-config.js <<EOF
          window.SUOLEMA_ANALYTICS = {
            base: "https://keyvalue.immanuel.co/api/KeyVal",
            appKey: "$APP_KEY"
          };
          EOF
          fi

          BASE="https://keyvalue.immanuel.co/api/KeyVal"
          for KEY in visit_total uv_total lock_total lock_users_total reset_total d1_total d7_total; do
            CURRENT="$(curl -fsSL --retry 2 --retry-delay 1 "$BASE/GetValue/$APP_KEY/$KEY" || true)"
            CLEAN="$(printf '%s' "$CURRENT" | tr -d '"\r\n ')"
            if [ -z "$CLEAN" ] || [ "$CLEAN" = "null" ]; then
              curl -fsSL --retry 2 --retry-delay 1 -X POST -d '' "$BASE/UpdateValue/$APP_KEY/$KEY/0" >/dev/null
            fi
          done

          printf '{"initialized":true,"service":"keyvalue","checked_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > suolema/analytics-status.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suolema/analytics-config.js suolema/analytics-status.json
          if git diff --cached --quiet; then
            echo "Analytics already initialized"
            exit 0
          fi
          git commit -m "Verify Suolema analytics"
          git push
