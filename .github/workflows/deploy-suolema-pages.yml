name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'suolema/**'
      - 'agentport/**'
      - 'labs/**'
      - 'lucky-money-choice/**'
      - '.github/workflows/deploy-suolema-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Persist Lucky Money Choice PWA shell to source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lucky-money-choice/index.html')
          s=p.read_text(encoding='utf-8')
          pwa_head='''\n<link rel="manifest" href="./manifest.webmanifest"/>\n<link rel="icon" href="./icon.svg" type="image/svg+xml"/>\n<meta name="apple-mobile-web-app-capable" content="yes"/>\n<meta name="apple-mobile-web-app-status-bar-style" content="default"/>\n<meta name="apple-mobile-web-app-title" content="压岁钱你做主"/>\n<meta name="mobile-web-app-capable" content="yes"/>\n'''
          pwa_script='\n<script src="./pwa.js" defer></script>\n'
          changed=False
          if 'manifest.webmanifest' not in s:
              s=s.replace('</head>', pwa_head+'</head>')
              changed=True
          if './pwa.js' not in s:
              s=s.replace('</body>', pwa_script+'</body>')
              changed=True
          if changed:
              p.write_text(s,encoding='utf-8')
          PY
          if ! git diff --quiet -- lucky-money-choice/index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lucky-money-choice/index.html
            git commit -m 'Persist PWA shell in Lucky Money Choice source'
            git push origin main
          fi

      - name: Prepare and verify site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -d suolema ]; then cp -R suolema _site/suolema; fi
          if [ -d agentport ]; then cp -R agentport _site/agentport; fi
          if [ -d labs ]; then cp -R labs _site/labs; fi
          if [ -d lucky-money-choice ]; then cp -R lucky-money-choice _site/lucky-money-choice; fi

          PARTS=_site/labs/one01/source
          OUT=_site/labs/one01/index.html
          test -f "$PARTS/000.part"
          test -f "$PARTS/006.part"
          cat "$PARTS/000.part" "$PARTS/001.part" "$PARTS/002.part" "$PARTS/003.part" "$PARTS/004.part" "$PARTS/005.part" "$PARTS/006.part" > "$OUT"

          echo "0c0c71954b44a9d7e1015bac10e8ccc9a69192d5be1627e01d9cc1046bc0fc8a  $OUT" | sha256sum -c -
          grep -q 'id="gl"' "$OUT"
          grep -q 'ONE-01 · Digital Life' "$OUT"
          grep -q "document.body.dataset.ready='1'" "$OUT"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/labs/one01/index.html')
          s=p.read_text(encoding='utf-8')
          marker="<script>document.documentElement.dataset.one01Js='1';</script>"
          s=s.replace('</body>', marker+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          rm -rf "$PARTS"

          test -f _site/lucky-money-choice/index.html
          test -f _site/lucky-money-choice/manifest.webmanifest
          test -f _site/lucky-money-choice/sw.js
          test -f _site/lucky-money-choice/pwa.js
          test -f _site/lucky-money-choice/icon.svg
          grep -q '压岁钱你做主' _site/lucky-money-choice/index.html
          grep -q '儿童生活模拟器' _site/lucky-money-choice/index.html
          grep -q 'manifest.webmanifest' _site/lucky-money-choice/index.html
          grep -q './pwa.js' _site/lucky-money-choice/index.html
          grep -q '"display": "standalone"' _site/lucky-money-choice/manifest.webmanifest

          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Ask Know</title><body><script>location.replace('./suolema/?src=pyq')</script><a href="./suolema/?src=pyq">打开</a></body></html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Public source smoke test - Lucky Money Choice PWA
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bw-sta.github.io/aiasknow-site/lucky-money-choice"
          URL="$BASE/?build=${GITHUB_SHA}"
          for i in {1..12}; do
            BODY="$(curl -fsSL --connect-timeout 10 --max-time 20 "$URL" || true)"
            MANIFEST="$(curl -fsSL --connect-timeout 10 --max-time 20 "$BASE/manifest.webmanifest?build=${GITHUB_SHA}" || true)"
            PWAJS="$(curl -fsSL --connect-timeout 10 --max-time 20 "$BASE/pwa.js?build=${GITHUB_SHA}" || true)"
            SW="$(curl -fsSL --connect-timeout 10 --max-time 20 "$BASE/sw.js?build=${GITHUB_SHA}" || true)"
            if printf '%s' "$BODY" | grep -q '压岁钱你做主' \
              && printf '%s' "$BODY" | grep -q 'manifest.webmanifest' \
              && printf '%s' "$BODY" | grep -q './pwa.js' \
              && printf '%s' "$MANIFEST" | grep -q '"display": "standalone"' \
              && printf '%s' "$PWAJS" | grep -q 'serviceWorker' \
              && printf '%s' "$SW" | grep -q "CACHE='lucky-money-choice-v1'"; then
              echo "Lucky Money Choice installable PWA assets are live"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Custom domain smoke test - Lucky Money Choice PWA
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://aiasknow.com/lucky-money-choice"
          URL="$BASE/?build=${GITHUB_SHA}"
          for i in {1..18}; do
            BODY="$(curl -fsSL --connect-timeout 10 --max-time 20 "$URL" || true)"
            MANIFEST="$(curl -fsSL --connect-timeout 10 --max-time 20 "$BASE/manifest.webmanifest?build=${GITHUB_SHA}" || true)"
            PWAJS="$(curl -fsSL --connect-timeout 10 --max-time 20 "$BASE/pwa.js?build=${GITHUB_SHA}" || true)"
            if printf '%s' "$BODY" | grep -q '压岁钱你做主' \
              && printf '%s' "$BODY" | grep -q 'manifest.webmanifest' \
              && printf '%s' "$BODY" | grep -q './pwa.js' \
              && printf '%s' "$MANIFEST" | grep -q '"display": "standalone"' \
              && printf '%s' "$PWAJS" | grep -q 'serviceWorker'; then
              echo "Lucky Money Choice custom-domain PWA is live"
              exit 0
            fi
            sleep 5
          done
          echo "Custom-domain PWA smoke test failed"
          exit 1

      - name: Public source smoke test - ONE-01
        shell: bash
        run: |
          set -euo pipefail
          URL="https://bw-sta.github.io/aiasknow-site/labs/one01/?build=${GITHUB_SHA}"
          for i in {1..12}; do
            BODY="$(curl -fsSL --connect-timeout 10 --max-time 20 "$URL" || true)"
            if printf '%s' "$BODY" | grep -q 'id="gl"' && printf '%s' "$BODY" | grep -q 'ONE-01 · Digital Life' && printf '%s' "$BODY" | grep -q "dataset.one01Js='1'"; then
              echo "ONE-01 standalone public HTML is live"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Browser WebGL execution smoke test - ONE-01
        shell: bash
        run: |
          set -euo pipefail
          URL="https://bw-sta.github.io/aiasknow-site/labs/one01/?build=${GITHUB_SHA}"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium found on runner"
            exit 1
          fi
          DOM="$($CHROME --headless=new --no-sandbox --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader --virtual-time-budget=4000 --dump-dom "$URL" 2>/tmp/one01-browser.err || true)"
          printf '%s' "$DOM" | grep -q 'id="gl"' || { echo "Final canvas DOM not found"; cat /tmp/one01-browser.err; exit 1; }
          printf '%s' "$DOM" | grep -q 'data-one01-js="1"' || { echo "JavaScript execution marker not found"; cat /tmp/one01-browser.err; exit 1; }
          printf '%s' "$DOM" | grep -q 'data-ready="1"' || { echo "ONE-01 WebGL ready state not reached"; cat /tmp/one01-browser.err; exit 1; }
          echo "ONE-01 public page loaded, WebGL initialized, and render loop reached ready state"
