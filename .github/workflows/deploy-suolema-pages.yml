name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'suolema/**'
      - 'agentport/**'
      - 'labs/**'
      - '.github/workflows/deploy-suolema-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare site
        run: |
          mkdir -p _site
          if [ -d suolema ]; then cp -R suolema _site/suolema; fi
          if [ -d agentport ]; then cp -R agentport _site/agentport; fi
          if [ -d labs ]; then cp -R labs _site/labs; fi
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Ask Know</title><body><script>location.replace('./suolema/?src=pyq')</script><a href="./suolema/?src=pyq">打开</a></body></html>
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Public smoke test - ONE-01
        shell: bash
        run: |
          URL="https://bw-sta.github.io/aiasknow-site/labs/one01/"
          echo "Checking $URL"
          for i in {1..12}; do
            BODY="$(curl -fsSL --connect-timeout 10 --max-time 20 "$URL" || true)"
            if printf '%s' "$BODY" | grep -q 'ONE-01'; then
              echo "ONE-01 public URL is live"
              exit 0
            fi
            echo "Attempt $i/12 not ready yet; retrying..."
            sleep 5
          done
          echo "Public smoke test failed"
          exit 1
