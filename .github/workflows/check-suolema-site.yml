name: Check Suolema Site

on:
  push:
    paths:
      - '.github/workflows/check-suolema-site.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose public URLs
        shell: bash
        run: |
          set -e
          echo '=== GitHub Pages product ==='
          curl -fsSIL --max-time 20 'https://bw-sta.github.io/aiasknow-site/suolema/?src=pyq'
          echo '=== GitHub Pages admin ==='
          curl -fsSIL --max-time 20 'https://bw-sta.github.io/aiasknow-site/suolema-admin/'
