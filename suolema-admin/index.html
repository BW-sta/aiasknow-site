<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3e6d6">
<title>锁了吗｜数据后台</title>
<style>
:root{--red:#781b16;--paper:#f3e6d6;--card:#fff8ef;--ink:#211a18;--muted:#7f7168;--line:#d7c5b3}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:760px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 18px 44px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px}.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--muted);margin-bottom:8px}.title{font-size:32px;font-weight:950;letter-spacing:-.04em}.date{font-size:13px;color:var(--muted);text-align:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid rgba(120,27,22,.12);border-radius:22px;padding:20px;min-height:138px;display:flex;flex-direction:column;justify-content:space-between}.card.hero{grid-column:span 2;border:3px solid var(--red);min-height:170px}.label{font-size:14px;color:var(--muted);font-weight:700}.value{font-size:46px;line-height:1;font-weight:950;letter-spacing:-.05em;color:var(--red)}.hero .value{font-size:70px}.suffix{font-size:17px;margin-left:5px;color:var(--muted);font-weight:800}.sub{margin-top:24px;border-top:1px solid var(--line);padding-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini{padding:12px 0}.mini b{display:block;font-size:24px;margin-top:5px}.mini span{font-size:13px;color:var(--muted)}.status{margin-top:24px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;align-items:center}.refresh{border:1px solid rgba(120,27,22,.25);background:transparent;color:var(--red);border-radius:999px;padding:9px 14px;font-weight:800}.error{display:none;background:#fff4ef;border:1px solid #d7a69a;border-radius:16px;padding:14px;margin-bottom:15px;font-size:14px}.error.show{display:block}@media(max-width:520px){.grid{grid-template-columns:1fr}.card.hero{grid-column:span 1}.hero .value{font-size:58px}.value{font-size:42px}.top{align-items:flex-start;flex-direction:column}.date{text-align:left}.sub{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div><div class="eyebrow">锁了吗 · V1</div><div class="title">数据后台</div></div>
    <div id="date" class="date">北京时间</div>
  </div>
  <div id="error" class="error">统计服务暂时没有返回数据，稍后刷新即可。前台使用不受影响。</div>
  <section class="grid">
    <div class="card hero"><div class="label">今日访问人数</div><div><span id="uv" class="value">0</span><span class="suffix">人</span></div></div>
    <div class="card"><div class="label">今日点锁人数</div><div><span id="lockUv" class="value">0</span><span class="suffix">人</span></div></div>
    <div class="card"><div class="label">确认率</div><div><span id="confirmRate" class="value">0%</span></div></div>
    <div class="card"><div class="label">次日复用率</div><div><span id="d1Rate" class="value">—</span></div></div>
    <div class="card"><div class="label">7日内复用人数</div><div><span id="d7" class="value">0</span><span class="suffix">人</span></div></div>
  </section>
  <section class="sub">
    <div class="mini"><span>今日打开次数</span><b id="pv">0</b></div>
    <div class="mini"><span>朋友圈入口今日访问</span><b id="pyq">0</b></div>
    <div class="mini"><span>累计新访客</span><b id="uvTotal">0</b></div>
    <div class="mini"><span>累计锁门确认</span><b id="lockTotal">0</b></div>
    <div class="mini"><span>累计回家重置</span><b id="resetTotal">0</b></div>
    <div class="mini"><span>累计打开</span><b id="visitTotal">0</b></div>
  </section>
  <div class="status"><span id="updated">正在读取数据…</span><button id="refresh" class="refresh" type="button">刷新</button></div>
</main>
<script src="../suolema/analytics-config.js"></script>
<script>
(()=>{
  const cfg=window.SUOLEMA_ANALYTICS;
  const error=document.getElementById('error');
  const base=cfg?.base?.replace(/\/$/,'');
  const appKey=cfg?.appKey;
  const parts=(offset=0)=>{
    const now=new Date(Date.now()+offset*86400000);
    const ps=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
    const m=Object.fromEntries(ps.map(p=>[p.type,p.value]));
    return `${m.year}${m.month}${m.day}`;
  };
  const today=()=>parts(0), yesterday=()=>parts(-1);
  const get=async key=>{
    if(!base||!appKey)return 0;
    try{
      const r=await fetch(`${base}/GetValue/${encodeURIComponent(appKey)}/${encodeURIComponent(key)}`,{cache:'no-store'});
      if(!r.ok)return 0;
      const t=(await r.text()).trim().replace(/^"|"$/g,'');
      const n=Number(t);
      return Number.isFinite(n)?n:0;
    }catch(e){throw e}
  };
  const set=(id,v)=>document.getElementById(id).textContent=v;
  async function load(){
    error.classList.remove('show');
    document.getElementById('date').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',weekday:'short'}).format(new Date())+' · 北京时间';
    try{
      const t=today(), y=yesterday();
      const [uv,lockUv,pv,newY,d1,d7,pyq,uvTotal,lockTotal,resetTotal,visitTotal]=await Promise.all([
        get(`uv_${t}`),get(`lock_uv_${t}`),get(`pv_${t}`),get(`new_${y}`),get(`d1_${t}`),get('d7_total'),get(`src_pyq_${t}`),get('uv_total'),get('lock_total'),get('reset_total'),get('visit_total')
      ]);
      set('uv',uv);set('lockUv',lockUv);set('pv',pv);set('d7',d7);set('pyq',pyq);set('uvTotal',uvTotal);set('lockTotal',lockTotal);set('resetTotal',resetTotal);set('visitTotal',visitTotal);
      set('confirmRate',uv?`${Math.round(lockUv/uv*100)}%`:'0%');
      set('d1Rate',newY?`${Math.round(d1/newY*100)}%`:'—');
      document.getElementById('updated').textContent='更新于 '+new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());
    }catch(e){
      error.classList.add('show');
      document.getElementById('updated').textContent='数据读取失败，稍后重试';
    }
  }
  document.getElementById('refresh').addEventListener('click',load);
  load();
})();
</script>
</body>
</html>
