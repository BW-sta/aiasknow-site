<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3e6d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="锁了吗">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>锁了吗</title>
<style>
:root{--red:#781b16;--red2:#a62c24;--black:#211a18;--paper:#f3e6d6;--card:#fff8ef;--muted:#7f7168}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;background:var(--paper);color:var(--black);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}body{min-height:100vh;overscroll-behavior:none}button{font:inherit}.app{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));min-height:100vh;background:var(--paper)}.brand{text-align:center;color:var(--muted);font-size:16px;letter-spacing:.28em;margin:8px 0 22px}.arena{position:relative;min-height:560px;overflow:hidden;border:6px solid var(--red);border-radius:32px;background:var(--card);display:flex;align-items:center;justify-content:center;width:100%;padding:0;appearance:none;-webkit-appearance:none;transition:background .35s ease,border-width .3s ease,transform .16s ease}.arena.locked{border-width:7px;box-shadow:inset 0 0 0 12px rgba(120,27,22,.07)}.corner{position:absolute;width:78px;height:78px;border-color:var(--red);border-style:solid;z-index:8;transition:all .4s cubic-bezier(.2,.85,.2,1)}.tl{left:22px;top:22px;border-width:11px 0 0 11px;border-radius:22px 0 0 0}.tr{right:22px;top:22px;border-width:11px 11px 0 0;border-radius:0 22px 0 0}.bl{left:22px;bottom:22px;border-width:0 0 11px 11px;border-radius:0 0 0 22px}.br{right:22px;bottom:22px;border-width:0 11px 11px 0;border-radius:0 0 22px 0}.locked .corner{width:48px;height:48px}.locked .tl{left:11px;top:11px}.locked .tr{right:11px;top:11px}.locked .bl{left:11px;bottom:11px}.locked .br{right:11px;bottom:11px}.core{position:relative;z-index:20;text-align:center;padding:32px 22px;border-radius:28px;transition:transform .16s ease,background .25s ease,box-shadow .25s ease}.pressed .core{transform:scale(.92)}.locked .core{background:rgba(255,248,239,.92);box-shadow:0 0 0 18px rgba(255,248,239,.66)}.action{font-size:136px;line-height:.86;font-weight:950;letter-spacing:-.08em;color:var(--red);user-select:none}.result{display:none}.locked .action{display:none}.locked .result{display:block}.main{font-size:72px;line-height:1;font-weight:950;letter-spacing:-.06em;color:var(--red)}.bar{height:9px;width:172px;background:var(--red);border-radius:999px;margin:20px auto 0}.time{display:block;margin-top:22px;font-size:28px;font-weight:950;color:var(--black)}.confirmed{display:block;margin-top:8px;font-size:19px;font-weight:950;color:var(--red)}.stamp{position:absolute;z-index:30;opacity:0;white-space:nowrap;font-weight:950;padding:8px 14px;border:4px solid currentColor;line-height:1;color:var(--red2);background:rgba(255,248,239,.92);transform:scale(1.55) rotate(var(--rot));transform-origin:center;box-shadow:0 0 0 1px rgba(123,29,23,.07);pointer-events:none;user-select:none}.stamp.black{color:var(--black)}.stamp.circle{border-radius:999px;padding:13px 18px}.stamp.hit{animation:hit .62s cubic-bezier(.17,.9,.22,1) forwards}@keyframes hit{0%{opacity:0;transform:scale(1.65) rotate(var(--rot))}38%{opacity:1;transform:scale(.88) rotate(var(--rot))}68%{transform:scale(1.045) rotate(var(--rot))}100%{opacity:1;transform:scale(1) rotate(var(--rot))}}.s1{left:-18px;top:34px;font-size:37px;--rot:-7deg}.s2{right:-12px;top:44px;font-size:35px;--rot:6deg}.s3{left:82px;top:116px;font-size:26px;--rot:-5deg}.s4{right:18px;top:142px;font-size:28px;--rot:7deg}.s5{left:-22px;top:228px;font-size:31px;--rot:-8deg}.s6{right:-22px;top:248px;font-size:33px;--rot:8deg}.s7{left:10px;bottom:126px;font-size:30px;--rot:8deg}.s8{right:-8px;bottom:138px;font-size:31px;--rot:-7deg}.s9{left:66px;bottom:38px;font-size:34px;--rot:-3deg}.s10{right:72px;bottom:54px;font-size:27px;--rot:5deg}.memory{text-align:center;margin-top:24px;font-size:22px;font-weight:950;color:var(--red);letter-spacing:.02em}.certainty{display:none;margin-top:30px;text-align:center;font-size:44px;line-height:1.12;font-weight:950;letter-spacing:-.035em;color:var(--red)}.certainty.show{display:block;animation:finalHit .72s cubic-bezier(.17,.9,.22,1)}@keyframes finalHit{0%{opacity:0;transform:scale(1.35)}45%{opacity:1;transform:scale(.92)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}.home-wrap{display:none;text-align:center;margin-top:24px}.home-wrap.show{display:block}.home-btn{border:0;background:transparent;color:var(--muted);padding:12px 18px;min-height:44px;text-decoration:underline;text-underline-offset:5px;cursor:pointer}@media(max-width:420px){.arena{min-height:520px}.action{font-size:118px}.main{font-size:60px}.certainty{font-size:38px}.stamp{border-width:3px}.s3{left:58px}.s9{left:42px}.s10{right:44px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<div class="brand">锁了吗</div>
<button id="arena" class="arena" type="button" aria-label="确认锁门">
<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
<span class="stamp s1">已确认</span><span class="stamp s2">锁好了</span><span class="stamp black s3">确认完成</span><span class="stamp circle s4">确定</span><span class="stamp s5">已经锁好</span><span class="stamp black s6">放心</span><span class="stamp s7">锁好了</span><span class="stamp black s8">已确认</span><span class="stamp s9">这次已完成</span><span class="stamp circle black s10">确定</span>
<span class="core"><span class="action">锁</span><span class="result"><span class="main">已锁门</span><span class="bar"></span><span id="timeText" class="time"></span><span class="confirmed">已确认</span></span></span>
</button>
<div id="memory" class="memory">锁门　锁门　锁门</div>
<div id="certainty" class="certainty">你确实锁门了</div>
<div id="homeWrap" class="home-wrap"><button id="homeBtn" class="home-btn" type="button">我回家了</button></div>
</main>
<script>
(()=>{const arena=document.getElementById('arena'),stamps=[...document.querySelectorAll('.stamp')],memory=document.getElementById('memory'),certainty=document.getElementById('certainty'),homeWrap=document.getElementById('homeWrap'),homeBtn=document.getElementById('homeBtn'),timeText=document.getElementById('timeText');let timers=[],locked=false;const storeKey='suolema_v1_state',later=(fn,ms)=>timers.push(setTimeout(fn,ms)),clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};function labelFor(date){const now=new Date(),sameDay=now.getFullYear()===date.getFullYear()&&now.getMonth()===date.getMonth()&&now.getDate()===date.getDate(),hh=String(date.getHours()).padStart(2,'0'),mm=String(date.getMinutes()).padStart(2,'0');return sameDay?`今天 ${hh}:${mm}`:`${date.getMonth()+1}月${date.getDate()}日 ${hh}:${mm}`}function clickSound(){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(118,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(72,ctx.currentTime+.09);gain.gain.setValueAtTime(.055,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.1);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.11)}catch(e){}}function saveState(date){try{localStorage.setItem(storeKey,JSON.stringify({locked:true,time:date.toISOString()}))}catch(e){}}function clearState(){try{localStorage.removeItem(storeKey)}catch(e){}}function showLocked(date,animate){locked=true;timeText.textContent=labelFor(date);arena.classList.add('locked');if(animate){const start=760,gap=520;stamps.forEach((stamp,i)=>later(()=>stamp.classList.add('hit'),start+i*gap));later(()=>{memory.style.display='none';certainty.classList.add('show');homeWrap.classList.add('show');arena.disabled=true},start+stamps.length*gap+450)}else{stamps.forEach(s=>s.classList.add('hit'));memory.style.display='none';certainty.classList.add('show');homeWrap.classList.add('show');arena.disabled=true}arena.setAttribute('aria-label','本次已经确认锁门')}function restore(){try{const raw=localStorage.getItem(storeKey);if(!raw)return;const state=JSON.parse(raw);if(!state.locked||!state.time)return;const d=new Date(state.time);if(Number.isNaN(d.getTime()))return;showLocked(d,false)}catch(e){}}arena.addEventListener('click',()=>{if(locked)return;clearTimers();const now=new Date();saveState(now);arena.classList.add('pressed');if(navigator.vibrate)navigator.vibrate(45);clickSound();later(()=>{arena.classList.remove('pressed');showLocked(now,true)},180)});homeBtn.addEventListener('click',()=>{clearTimers();clearState();locked=false;arena.disabled=false;arena.classList.remove('locked','pressed');arena.setAttribute('aria-label','确认锁门');stamps.forEach(s=>s.classList.remove('hit'));certainty.classList.remove('show');homeWrap.classList.remove('show');memory.style.display='block';timeText.textContent=''});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));restore()})();
</script>
</body>
</html>
