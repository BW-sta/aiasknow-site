<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#F6F3EC" />
<title>体验课成交 Skill</title>
<style>
:root{--bg:#F6F3EC;--card:#FFFDF8;--text:#20241F;--muted:#747A72;--line:#E5DED3;--accent:#285A43;--soft:#E6F0E9;--warn:#F4ECE0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100dvh}button,input,select{font:inherit}.app{max-width:500px;margin:auto;min-height:100dvh;padding:18px 18px calc(28px + env(safe-area-inset-bottom))}.top{height:46px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:14px;font-weight:800}.small{font-size:12px;color:var(--muted)}.screen{padding-top:30px}.kicker{font-size:13px;color:var(--muted);margin-bottom:8px}h1{font-size:32px;line-height:1.16;letter-spacing:-.04em;margin:0 0 12px}.desc{font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 24px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px}.name{font-size:30px;font-weight:850;letter-spacing:-.04em}.meta{font-size:13px;color:var(--muted);line-height:1.55;margin-top:7px}.block{margin-top:18px;padding-top:17px;border-top:1px solid var(--line)}.label{font-size:12px;color:var(--muted);margin-bottom:7px}.goal{font-size:19px;font-weight:820;line-height:1.45}.message{background:#F1EEE7;border-radius:16px;padding:14px;font-size:15px;line-height:1.65}.actions{display:grid;gap:10px;margin-top:16px}.primary,.secondary,.choice{border:0;border-radius:16px;padding:16px 18px;font-size:16px;font-weight:780}.primary{background:var(--accent);color:#fff}.secondary{background:#EAE4D9;color:var(--text)}.choice{background:var(--card);border:1px solid var(--line);text-align:left;color:var(--text)}.result-grid{display:grid;gap:10px;margin-top:18px}.result{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.result b{font-size:25px}.result span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.form{display:grid;gap:13px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:14px;color:var(--text)}.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}.done{background:var(--soft);border-radius:18px;padding:16px;font-size:14px;line-height:1.6}.warn{background:var(--warn);border-radius:18px;padding:14px;font-size:13px;line-height:1.6;color:#6A5437}.ghost{border:0;background:transparent;color:var(--muted);padding:8px 0}.stack{display:grid;gap:10px}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="brand">体验课成交 Skill</div><button class="ghost" onclick="resetAll()">重置</button></div>
  <section id="screen" class="screen"></section>
</main>
<script src="./skill-engine.js"></script>
<script>
const KEY='gym_conversion_skill_v2';
const screen=document.getElementById('screen');
let customers=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(customers))}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function current(){return GymConversionSkill.nextCustomer(customers)}
function start(){
  if(customers.length)return renderTask();
  screen.innerHTML=`<div class="kicker">一个结果</div><h1>把体验课<br>追到明确结果</h1><p class="desc">不做CRM，不做看板。一次只处理一个未成交客户。</p><div class="actions"><button class="primary" onclick="demo()">用3个示例跑一遍</button><button class="secondary" onclick="renderAdd()">添加一个客户</button></div>`;
}
window.demo=()=>{customers=GymConversionSkill.demo();save();renderTask()};
function renderTask(){
  const c=current();
  if(!c)return renderFinish();
  if(c.stage==='已发送')return renderOutcome(c);
  const t=GymConversionSkill.task(c);
  screen.innerHTML=`<div class="kicker">现在只做这一件事</div><div class="card"><div class="name">${esc(c.name)}</div><div class="meta">体验 ${esc(c.trialDate)} · ${esc(c.intent)}意向 · ${esc(c.objection)}</div><div class="block"><div class="label">这次目标</div><div class="goal">${esc(t.goal)}</div></div><div class="block"><div class="label">直接发</div><div id="msg" class="message">${esc(t.message)}</div></div></div><div class="actions"><button class="primary" onclick="sent('${c.id}')">复制 · 已发送</button><button class="secondary" onclick="skip('${c.id}')">今天先不联系</button></div><div class="hint">Skill只负责把客户推进到：成交 / 明确不买。没有结果，不自动消失。</div>`;
}
window.sent=async id=>{const c=customers.find(x=>x.id===id);if(!c)return;const txt=GymConversionSkill.task(c).message;try{await navigator.clipboard.writeText(txt)}catch(e){}GymConversionSkill.apply(c,'sent');save();renderOutcome(c)};
window.skip=id=>{const c=customers.find(x=>x.id===id);if(!c)return;c.intent=c.intent==='高'?'中':'低';save();renderTask()};
function renderOutcome(c){
  screen.innerHTML=`<div class="kicker">刚才那次联系</div><h1>${esc(c.name)}怎么样？</h1><div class="stack"><button class="choice" onclick="outcome('${c.id}','replied')">回复了</button><button class="choice" onclick="outcome('${c.id}','no_reply')">没回复</button><button class="choice" onclick="outcome('${c.id}','booked')">已约到店</button><button class="choice" onclick="closeDeal('${c.id}')">已成交</button><button class="choice" onclick="outcome('${c.id}','lost')">明确不买</button></div>`;
}
window.outcome=(id,a)=>{const c=customers.find(x=>x.id===id);if(!c)return;GymConversionSkill.apply(c,a);save();if(a==='replied'||a==='booked'){renderNextStep(c)}else renderTask()};
function renderNextStep(c){
  const t=GymConversionSkill.task(c);
  screen.innerHTML=`<div class="kicker">下一步已经定好</div><div class="card"><div class="name">${esc(c.name)}</div><div class="block"><div class="label">现在只做</div><div class="goal">${esc(t.goal)}</div></div><div class="block"><div class="label">直接发</div><div class="message">${esc(t.message)}</div></div></div><div class="actions"><button class="primary" onclick="sent('${c.id}')">复制 · 已发送</button><button class="secondary" onclick="renderTask()">先处理下一位</button></div>`;
}
window.closeDeal=id=>{const c=customers.find(x=>x.id===id);if(!c)return;const v=prompt('成交金额','2999');if(v===null)return;GymConversionSkill.apply(c,'closed',v);save();renderTask()};
function renderFinish(){
  const s=GymConversionSkill.summary(customers);
  screen.innerHTML=`<div class="kicker">交付完成</div><h1>这批客户<br>都有结果了</h1><div class="result-grid"><div class="result"><b>${s.closed}</b><span>成交</span></div><div class="result"><b>¥${s.revenue}</b><span>成交金额</span></div><div class="result"><b>${s.total-s.closed}</b><span>明确不买</span></div></div><div class="done">Skill没有停在“建议怎么跟进”，而是把这批体验客户一直追到了明确结果。</div><div class="actions"><button class="secondary" onclick="renderAdd()">继续加客户</button></div>`;
}
function renderAdd(){
  const today=new Date().toISOString().slice(0,10);
  screen.innerHTML=`<button class="ghost" onclick="start()">← 返回</button><div class="kicker">只填4项</div><h1>加一个客户</h1><div class="form"><div class="field"><label>称呼</label><input id="name" placeholder="王女士"></div><div class="field"><label>体验日期</label><input id="date" type="date" value="${today}"></div><div class="field"><label>意向</label><select id="intent"><option>高</option><option selected>中</option><option>低</option></select></div><div class="field"><label>现在卡在哪</label><select id="ob"><option>价格</option><option>时间</option><option>在比较</option><option>没回复</option><option>没明显卡点</option></select></div></div><div class="actions"><button class="primary" onclick="add()">开始处理</button></div>`;
}
window.add=()=>{const n=document.getElementById('name').value.trim();if(!n)return;customers.push({id:GymConversionSkill.uid(),name:n,trialDate:document.getElementById('date').value,intent:document.getElementById('intent').value,objection:document.getElementById('ob').value,stage:'待联系',result:'',noReply:0,amount:0});save();renderTask()};
window.resetAll=()=>{if(confirm('清空当前数据？')){customers=[];localStorage.removeItem(KEY);start()}};
start();
</script>
</body>
</html>
