<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#F5F2EA" />
<title>体验课成交执行 Skill</title>
<style>
:root{--bg:#F5F2EA;--card:#FFFDF8;--text:#20251F;--muted:#71776F;--line:#E2DDD2;--accent:#275A42;--soft:#E6F0E9;--warn:#8C5B2D;--danger:#8A3F3F;--shadow:0 14px 42px rgba(40,48,42,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100dvh}button,input,select,textarea{font:inherit}.app{max-width:540px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-right)) calc(90px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}.top{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:14px;font-weight:800}.ver{font-size:11px;color:#9BA099;margin-left:5px}.ghost{border:0;background:transparent;color:var(--muted);font-size:13px;padding:8px}.screen{padding:24px 0 10px;animation:fade .18s ease}@keyframes fade{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}.kicker{font-size:13px;color:var(--muted);margin-bottom:8px}h1{font-size:32px;line-height:1.16;letter-spacing:-.04em;margin:0 0 12px}.desc{font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 24px}.actions{display:grid;gap:10px}.primary,.secondary,.danger{border:0;border-radius:16px;padding:16px 18px;font-weight:780;font-size:16px}.primary{background:var(--accent);color:white}.secondary{background:#EAE4D9;color:var(--text)}.danger{background:#F1E2E0;color:var(--danger)}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.metric{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px 10px}.metric b{display:block;font-size:21px;line-height:1.1}.metric span{display:block;font-size:11px;color:var(--muted);margin-top:5px}.person{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:27px;font-weight:850;letter-spacing:-.03em}.score{font-size:12px;padding:7px 9px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}.meta{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.6}.block{margin-top:18px;padding-top:17px;border-top:1px solid var(--line)}.label{font-size:12px;color:var(--muted);margin-bottom:7px}.goal{font-size:19px;font-weight:800;line-height:1.45}.why{font-size:14px;color:#4F5750;line-height:1.6}.script{margin-top:9px;background:#F0EDE6;border-radius:16px;padding:14px;font-size:15px;line-height:1.65}.row-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.mini-btn{border:0;border-radius:14px;padding:13px 10px;font-weight:750;background:#EAE5DB;color:var(--text)}.mini-btn.good{background:var(--soft);color:var(--accent)}.mini-btn.dark{background:var(--accent);color:white}.mini-btn.warn{background:#F4EBDD;color:var(--warn)}.section-title{font-size:21px;font-weight:850;margin:22px 0 11px}.list{display:grid;gap:10px}.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.item-head{display:flex;justify-content:space-between;gap:10px}.item-name{font-weight:800}.status{font-size:11px;padding:5px 7px;border-radius:999px;background:#EEE9DF;color:#60665F}.item-meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}.next{font-size:13px;font-weight:720;margin-top:8px}.form{display:grid;gap:13px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:14px;outline:none;color:var(--text)}.field input:focus,.field select:focus{border-color:#9CB3A3}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;padding:36px 14px;color:var(--muted);font-size:14px}.result-big{font-size:38px;font-weight:900;letter-spacing:-.045em}.result-label{font-size:13px;color:var(--muted);margin-top:4px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.result-cell{padding:15px;background:#F1EEE7;border-radius:16px}.result-cell b{font-size:23px}.result-cell span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(540px,100%);padding:9px 18px calc(9px + env(safe-area-inset-bottom));background:rgba(245,242,234,.94);backdrop-filter:blur(18px);border-top:1px solid rgba(220,214,202,.8);display:none;grid-template-columns:repeat(3,1fr);gap:8px}.nav button{border:0;background:transparent;padding:10px 6px;border-radius:13px;color:var(--muted);font-size:12px;font-weight:730}.nav button.active{background:#E8E3D9;color:var(--text)}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%) translateY(12px);background:#232923;color:white;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.18s;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main class="app"><div class="top"><div class="brand">体验课成交执行 <span class="ver">Skill V1</span></div><button class="ghost" onclick="resetAll()">重置</button></div><section id="screen" class="screen"></section></main>
<nav id="nav" class="nav"><button id="n_today" onclick="renderToday()">今天</button><button id="n_people" onclick="renderPeople()">客户</button><button id="n_result" onclick="renderResult()">结果</button></nav>
<div id="toast" class="toast"></div>
<script src="./skill-engine.js"></script>
<script>
const KEY='gym_conversion_skill_v1';
const screen=document.getElementById('screen'),nav=document.getElementById('nav');
let customers=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(customers))}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1300)}
function setNav(id){nav.style.display=customers.length?'grid':'none';['today','people','result'].forEach(x=>document.getElementById('n_'+x).classList.toggle('active',x===id))}
function home(){setNav('');screen.innerHTML=`<div class="kicker">从7天观察进入执行</div><h1>别再给建议<br>直接追到结果</h1><p class="desc">把体验后没成交的人交给这个 Skill。它负责排序、话术、下一步和结果追踪。你只做必须由真人完成的联系动作。</p><div class="actions"><button class="primary" onclick="useDemo()">用示例客户跑一遍</button><button class="secondary" onclick="renderAdd(true)">添加我的客户</button></div>`}
window.useDemo=()=>{customers=GymConversionSkill.demo();save();renderToday()};
function activeQueue(){return customers.filter(c=>!['已成交','流失'].includes(c.status)).sort((a,b)=>GymConversionSkill.priority(b)-GymConversionSkill.priority(a))}
function metricsBar(){const m=GymConversionSkill.metrics(customers);return `<div class="metrics"><div class="metric"><b>${m.contacted}</b><span>已联系</span></div><div class="metric"><b>${m.replied}</b><span>已回复</span></div><div class="metric"><b>${m.closed}</b><span>已成交</span></div></div>`}
window.renderToday=function(){setNav('today');const q=activeQueue();if(!q.length){screen.innerHTML=`${metricsBar()}<div class="card"><div class="kicker">任务清空</div><h1 style="font-size:27px">今天没有待处理客户</h1><p class="desc">成交和流失都已经有明确结果。去“结果”看实际交付。</p></div>`;return}const c=q[0],t=GymConversionSkill.task(c);screen.innerHTML=`${metricsBar()}<div class="kicker">现在只处理这一位</div><div class="card"><div class="person"><div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.source||'未知来源')} · ${esc(c.trialDate)} · ${esc(c.intent)}意向 · ${esc(c.objection)}</div></div><div class="score">优先 ${t.score}</div></div><div class="block"><div class="label">这次唯一目标</div><div class="goal">${esc(t.goal)}</div></div><div class="block"><div class="label">为什么是他/她</div><div class="why">${esc(t.why)}</div></div><div class="block"><div class="label">直接发这段</div><div id="script" class="script">${esc(t.message)}</div><div class="row-actions"><button class="mini-btn dark" onclick="copyAndContact('${c.id}')">复制并记为已联系</button><button class="mini-btn good" onclick="mark('${c.id}','已回复')">已回复</button><button class="mini-btn good" onclick="mark('${c.id}','已预约')">已预约</button><button class="mini-btn good" onclick="deal('${c.id}')">已成交</button><button class="mini-btn warn" onclick="pauseClient('${c.id}')">暂缓</button><button class="mini-btn" onclick="mark('${c.id}','流失')">流失</button></div></div></div><div class="section-title">后面还有 ${Math.max(0,q.length-1)} 人</div><div class="list">${q.slice(1,4).map(x=>`<div class="item"><div class="item-head"><div class="item-name">${esc(x.name)}</div><span class="status">${esc(x.status)}</span></div><div class="item-meta">${esc(x.intent)}意向 · ${esc(x.objection)}</div><div class="next">下一步：${esc(GymConversionSkill.nextAction(x))}</div></div>`).join('')}</div>`}
window.copyAndContact=async function(id){const c=customers.find(x=>x.id===id);if(!c)return;const txt=GymConversionSkill.task(c).message;try{await navigator.clipboard.writeText(txt)}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}c.followUps=(Number(c.followUps)||0)+1;c.status='已联系';c.lastActionAt=new Date().toISOString();save();toast('已复制，已记为联系');setTimeout(renderToday,250)};
window.mark=function(id,status){const c=customers.find(x=>x.id===id);if(!c)return;if(status==='流失'&&!confirm('确认这位客户已经明确流失？'))return;c.status=status;c.lastActionAt=new Date().toISOString();save();toast(status);renderToday()};
window.deal=function(id){const c=customers.find(x=>x.id===id);if(!c)return;const v=prompt('成交金额','2999');if(v===null)return;c.amount=Math.max(0,Number(v)||0);c.status='已成交';c.lastActionAt=new Date().toISOString();save();toast('已记录成交');renderToday()};
window.pauseClient=function(id){const c=customers.find(x=>x.id===id);if(!c)return;const d=new Date();d.setDate(d.getDate()+7);const v=prompt('哪天再联系？ YYYY-MM-DD',d.toISOString().slice(0,10));if(v===null)return;c.status='暂缓';c.resumeDate=v;c.lastActionAt=new Date().toISOString();save();toast('已放入暂缓');renderToday()};
window.renderPeople=function(){setNav('people');screen.innerHTML=`<div class="kicker">执行名单</div><h1>所有客户</h1><div class="actions" style="margin-bottom:16px"><button class="primary" onclick="renderAdd(false)">添加客户</button></div><div class="list">${customers.length?customers.slice().sort((a,b)=>GymConversionSkill.priority(b)-GymConversionSkill.priority(a)).map(c=>`<div class="item"><div class="item-head"><div class="item-name">${esc(c.name)}</div><span class="status">${esc(c.status)}</span></div><div class="item-meta">${esc(c.trialDate)} · ${esc(c.intent)}意向 · ${esc(c.objection)} · 跟进${c.followUps||0}次</div><div class="next">${esc(GymConversionSkill.nextAction(c))}</div></div>`).join(''):'<div class="empty">还没有客户</div>'}</div>`}
window.renderAdd=function(first){setNav('');const today=new Date().toISOString().slice(0,10);screen.innerHTML=`<button class="ghost" onclick="${first?'home()':'renderPeople()'}">← 返回</button><div class="kicker">只填最少信息</div><h1>加一个体验客户</h1><div class="form"><div class="field"><label>称呼</label><input id="f_name" placeholder="王女士"></div><div class="grid2"><div class="field"><label>体验日期</label><input id="f_date" type="date" value="${today}"></div><div class="field"><label>来源</label><select id="f_source"><option>抖音</option><option>美团点评</option><option>转介绍</option><option>地推</option><option>私域</option><option>其他</option></select></div></div><div class="grid2"><div class="field"><label>意向</label><select id="f_intent"><option>高</option><option selected>中</option><option>低</option></select></div><div class="field"><label>主要卡点</label><select id="f_ob"><option>价格</option><option>时间</option><option>还在比较</option><option>没回复</option><option>没明显卡点</option></select></div></div><button class="primary" onclick="addClient(${first?'true':'false'})">加入执行队列</button></div>`}
window.addClient=function(first){const name=document.getElementById('f_name').value.trim();if(!name){document.getElementById('f_name').focus();return}customers.push({id:GymConversionSkill.uid(),name,trialDate:document.getElementById('f_date').value,intent:document.getElementById('f_intent').value,objection:document.getElementById('f_ob').value,status:'未处理',followUps:0,amount:0,source:document.getElementById('f_source').value});save();toast('已进入执行队列');renderToday()};
window.renderResult=function(){setNav('result');const m=GymConversionSkill.metrics(customers);screen.innerHTML=`<div class="kicker">真实执行结果</div><div class="card"><div class="result-big">¥${m.revenue.toLocaleString()}</div><div class="result-label">已成交金额</div><div class="result-grid"><div class="result-cell"><b>${m.closed}</b><span>成交客户</span></div><div class="result-cell"><b>${m.closeRate}%</b><span>名单成交率</span></div><div class="result-cell"><b>${m.replyRate}%</b><span>联系后回复率</span></div><div class="result-cell"><b>${activeQueue().length}</b><span>仍待处理</span></div></div></div><div class="section-title">交付状态</div><div class="list"><div class="item"><div class="item-head"><div class="item-name">已成交</div><span class="status">${m.closed}</span></div><div class="item-meta">有明确成交结果并记录金额</div></div><div class="item"><div class="item-head"><div class="item-name">仍在追踪</div><span class="status">${activeQueue().length}</span></div><div class="item-meta">没有明确结果的客户不会自动消失</div></div></div><div class="actions" style="margin-top:18px"><button class="secondary" onclick="exportCSV()">导出执行结果 CSV</button></div>`}
window.exportCSV=function(){const blob=new Blob(['\ufeff'+GymConversionSkill.csv(customers)],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='体验课成交执行结果.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
window.resetAll=function(){if(!customers.length)return home();if(!confirm('清空当前执行数据？'))return;customers=[];localStorage.removeItem(KEY);home()};
customers.length?renderToday():home();
</script>
</body>
</html>
