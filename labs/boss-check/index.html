<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F3E8" />
<title>老板经营体检</title>
<style>
:root{--bg:#F7F3E8;--card:#FFFDF8;--text:#1F251F;--muted:#74796F;--line:#E3DDD1;--accent:#2F5E46;--soft:#E5EFE8;--warn:#8C5A2B;--shadow:0 14px 42px rgba(45,55,47,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{min-height:100dvh}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}.top{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:14px;font-weight:780}.step{font-size:12px;color:var(--muted)}.bar{height:4px;background:#E7E1D5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:.25s}.screen{padding:34px 0 24px;animation:in .2s ease}@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}.kicker{font-size:13px;color:var(--muted);margin-bottom:9px}h1{font-size:31px;line-height:1.2;letter-spacing:-.035em;margin:0 0 22px}.desc{font-size:14px;color:var(--muted);line-height:1.6;margin:-10px 0 22px}.grid{display:grid;gap:11px}.option{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:17px 18px;text-align:left;font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:space-between;cursor:pointer;-webkit-tap-highlight-color:transparent}.option:active{transform:scale(.987)}.chev{color:#A3A69E;font-size:20px}.back{border:0;background:none;color:var(--muted);padding:8px 0 16px;font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.label{font-size:13px;color:var(--muted);margin-bottom:8px}.title{font-size:29px;font-weight:830;line-height:1.2;letter-spacing:-.03em}.reason{font-size:15px;line-height:1.72;color:#444B44;margin:16px 0 0}.tags{display:grid;gap:9px;border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.tag{padding:11px 13px;border-radius:14px;background:var(--soft);color:var(--accent);font-size:14px;font-weight:730}.tag.gray{background:#F0ECE3;color:#5E625C}.tag.warn{background:#F5EBDD;color:var(--warn)}.actions{display:grid;gap:10px;margin-top:17px}.primary,.secondary{border:0;border-radius:16px;padding:16px 18px;font-size:16px;font-weight:780}.primary{background:var(--accent);color:white}.secondary{background:#ECE6DA;color:var(--text)}.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:14px;outline:none;font-size:17px}.field input:focus{border-color:#9DB5A5}.daybox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:14px}.daybox b{font-size:14px}.daybox div{font-size:13px;color:#555D56;line-height:1.65;margin-top:6px}.mini{font-size:13px;color:var(--muted);margin-bottom:18px}.summary{display:grid;gap:10px;margin-top:18px}.summary div{padding:13px 14px;background:#F1EEE6;border-radius:14px;font-size:14px;font-weight:680}.free{margin-top:18px;border-top:1px solid var(--line);padding-top:17px}.free input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:15px;font-size:16px;outline:none}.free button{margin-top:9px;width:100%;border:0;border-radius:15px;padding:14px;background:#EAE4D8;font-weight:730;color:var(--text)}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="brand">老板经营体检</div><div id="step" class="step">开始</div></div>
  <div class="bar"><i id="bar"></i></div>
  <section id="screen" class="screen"></section>
</main>
<script src="./skill-engine.js"></script>
<script>
const screen=document.getElementById('screen'),step=document.getElementById('step'),bar=document.getElementById('bar');
const state={business:null,symptom:null,answers:{},history:[],diagnosis:null};
const KEY='boss_check_v02_rows';
function setProgress(n,t){step.textContent=t?`${n} / ${t}`:'开始';bar.style.width=t?`${Math.min(100,n/t*100)}%`:'0%'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function options(title,items,onClick,kicker='经营体检',desc=''){
  screen.innerHTML=`${state.history.length?'<button class="back" onclick="back()">← 返回</button>':''}<div class="kicker">${kicker}</div><h1>${title}</h1>${desc?`<div class="desc">${desc}</div>`:''}<div class="grid">${items.map((x,i)=>`<button class="option" onclick="${onClick}(${i})"><span>${esc(x)}</span><span class="chev">›</span></button>`).join('')}</div>`;
}
function start(){state.business=null;state.symptom=null;state.answers={};state.history=[];state.diagnosis=null;setProgress(0,0);const vals=Object.entries(BossSkill.BUSINESS);window._biz=vals;options('你做什么生意？',vals.map(x=>x[1].label),'pickBusiness');}
window.pickBusiness=i=>{state.history.push({type:'start'});state.business=window._biz[i][0];renderSymptoms()};
function renderSymptoms(){setProgress(1,5);options('最头疼？',BossSkill.SYMPTOMS.map(x=>x.label),'pickSymptom')}
window.pickSymptom=i=>{state.history.push({type:'symptom'});state.symptom=BossSkill.SYMPTOMS[i].id;state.answers={};renderNext()};
function renderNext(){const q=BossSkill.nextQuestion(state);if(!q){state.diagnosis=BossSkill.result(state);return renderResult()}const qs=(BossSkill.nextQuestion?true:true);const answered=Object.keys(state.answers).length;setProgress(2+answered,5);window._q=q;window._opts=BossSkill.optionsFor(q,state);options(q.title,window._opts,'answerQ',BossSkill.BUSINESS[state.business].label)}
window.answerQ=i=>{const q=window._q;state.history.push({type:'q',id:q.id});state.answers[q.id]=window._opts[i];renderNext()};
window.back=()=>{const last=state.history.pop();if(!last)return start();if(last.type==='q'){delete state.answers[last.id];return renderNext()}if(last.type==='symptom'){state.symptom=null;state.answers={};return renderSymptoms()}if(last.type==='start')return start()};
function renderResult(){const r=state.diagnosis;setProgress(5,5);const item=r.item?` · ${esc(r.item)}`:'';screen.innerHTML=`<div class="kicker">先验证这个${item}</div><div class="card"><div class="label">最值得先解决</div><div class="title">${esc(r.problem)}</div><p class="reason">${esc(r.reason)}</p><div class="tags"><div class="tag">先做：${esc(r.first)}</div><div class="tag gray">再做：${esc(r.second)}</div><div class="tag warn">暂缓：${esc(r.pause)}</div></div></div><div class="actions"><button class="primary" onclick="observe()">开始7天观察</button><button class="secondary" onclick="start()">重新体检</button></div><div class="note">这不是确诊。先用7天记录验证。</div>`}
function rows(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function saveRows(v){localStorage.setItem(KEY,JSON.stringify(v))}
window.observe=()=>{localStorage.removeItem(KEY);renderObserve()};
function renderObserve(){const rs=rows(),day=Math.min(rs.length+1,7),fields=BossSkill.observeFields(state,state.diagnosis);setProgress(day,7);window._fields=fields;screen.innerHTML=`<button class="back" onclick="renderResult()">← 返回结果</button><div class="kicker">第 ${day} 天</div><h1>今天记一下</h1><div class="mini">${state.diagnosis.item?`先盯：${esc(state.diagnosis.item)}`:'30秒就够'}</div><div class="fields">${fields.map(f=>`<div class="field"><label>${esc(f.label)}</label><input id="f_${f.id}" inputmode="${f.type==='number'?'decimal':'text'}" placeholder="填写"></div>`).join('')}</div><div class="actions"><button class="primary" onclick="saveDay()">${rs.length===6?'完成7天':'保存今天'}</button></div>${rs.length?`<div class="daybox"><b>已记录 ${rs.length} 天</b><div>${rs.slice(-3).reverse().map((r,i)=>`第 ${rs.length-i} 天 · ${fields.map(f=>`${f.label} ${esc(r.values[f.id]||'—')}`).join(' · ')}`).join('<br>')}</div></div>`:''}`}
window.saveDay=()=>{const fields=window._fields,vals={};fields.forEach(f=>vals[f.id]=document.getElementById('f_'+f.id).value.trim());if(Object.values(vals).every(v=>!v)){alert('至少填一项');return}const rs=rows();rs.push({date:new Date().toISOString(),values:vals});saveRows(rs);if(rs.length>=7)renderSummary();else renderObserve()};
function renderSummary(){const rs=rows(),lines=BossSkill.summarize(state,rs);setProgress(7,7);screen.innerHTML=`<div class="kicker">7天完成</div><div class="card"><div class="label">现在有证据了</div><div class="title">${esc(state.diagnosis.problem)}</div><div class="summary">${lines.length?lines.map(x=>`<div>${esc(x)}</div>`).join(''):'<div>记录已完成，可以开始人工复盘。</div>'}</div><p class="reason">下一步不是马上做大系统，而是用这7天记录确认问题，再决定要不要做补货、复购、利润或获客工具。</p></div><div class="actions"><button class="primary" onclick="review()">看下一步</button><button class="secondary" onclick="start()">重新体检</button></div>`}
window.review=()=>{screen.innerHTML=`<div class="kicker">FDE 下一步</div><h1>只改一个点</h1><div class="card"><div class="label">当前假设</div><div class="title">${esc(state.diagnosis.problem)}</div><div class="tags"><div class="tag">1 · 整理7天记录</div><div class="tag gray">2 · 找最大异常</div><div class="tag gray">3 · 做最小工具</div><div class="tag warn">4 · 30天后看结果</div></div></div><div class="note">这一步开始，才进入真正的FDE改造。</div>`}
start();
</script>
</body>
</html>
