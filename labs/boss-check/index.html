<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F3E8" />
<title>老板经营体检</title>
<style>
:root{--bg:#F7F3E8;--card:#FFFDF8;--text:#1F251F;--muted:#6E746D;--line:#E4DED2;--accent:#2F5E46;--accent-soft:#E4EFE8;--warn:#8C5A2B;--shadow:0 12px 36px rgba(45,55,47,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}body{min-height:100dvh}button,input{font:inherit}.app{max-width:520px;margin:0 auto;min-height:100dvh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:750;font-size:14px}.step{font-size:12px;color:var(--muted)}.progress{height:4px;background:#E8E2D7;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}.screen{padding:36px 0 22px;animation:fade .22s ease}@keyframes fade{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}.kicker{font-size:13px;color:var(--muted);margin-bottom:10px}h1{font-size:31px;line-height:1.2;margin:0 0 10px;letter-spacing:-.035em}.desc{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 26px}.options{display:grid;gap:12px}.option{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);padding:18px;border-radius:18px;text-align:left;font-size:18px;font-weight:680;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.option:active{transform:scale(.988)}.chev{font-size:20px;color:#A2A59F}.back{border:0;background:transparent;padding:10px 2px;color:var(--muted);font-size:14px}.result-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.result-label{font-size:13px;color:var(--muted);margin-bottom:8px}.result-title{font-size:29px;line-height:1.2;font-weight:820;letter-spacing:-.03em;margin-bottom:18px}.result-reason{font-size:15px;line-height:1.7;margin:0;color:#424942}.priority{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:10px}.pill{background:var(--accent-soft);color:var(--accent);padding:11px 13px;border-radius:14px;font-weight:700;font-size:14px}.pill.secondary{background:#F0ECE3;color:#5B5F59}.pill.stop{background:#F4EBDD;color:var(--warn)}.actions{display:grid;gap:11px;margin-top:18px}.primary,.secondary-btn{border:0;border-radius:16px;padding:16px 18px;font-weight:760;font-size:16px}.primary{background:var(--accent);color:white}.secondary-btn{background:#EDE7DB;color:var(--text)}.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5}.field{margin-bottom:15px}.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 7px}.field input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:15px 14px;outline:none;font-size:17px}.obs-list{margin-top:18px;display:grid;gap:10px}.obs-item{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:13px 14px;font-size:13px;line-height:1.55;color:#4E554F}.small-head{font-size:21px;font-weight:800;margin:0 0 16px}.footer-space{height:20px}
</style>
</head>
<body>
<main class="app"><div class="topbar"><div class="brand">老板经营体检</div><div class="step" id="stepText">1 / 4</div></div><div class="progress"><i id="progressBar"></i></div><section id="screen" class="screen"></section></main>
<script>
const state={history:[],answers:{},branch:null,resultKey:null};
const FLOW={
start:{title:"最头疼？",options:[["客人少","traffic"],["买得少","basket"],["总缺货","stockout"],["总剩货","waste"],["老客少","repeat"],["不赚钱","profit"],["说不清","unclear"]]},
traffic_1:{title:"主要靠什么来客？",options:[["路过","traffic_2"],["老客","traffic_2"],["短视频","traffic_2"],["微信群","traffic_2"],["团购平台","traffic_2"],["没固定来源","traffic_2"]]},traffic_2:{title:"客人少多久？",options:[["一两周","traffic_3"],["一两个月","traffic_3"],["半年以上","traffic_3"],["一直不多","traffic_3"]]},traffic_3:{title:"知道客人从哪来？",options:[["大概知道","RESULT_TRAFFIC"],["不知道","RESULT_TRAFFIC"]]},
basket_1:{title:"客人通常怎么买？",options:[["只买一两样","basket_2"],["会顺手多买","basket_2"],["看价格再决定","basket_2"],["不太清楚","basket_2"]]},basket_2:{title:"有固定搭配吗？",options:[["有","basket_3"],["没有","basket_3"]]},basket_3:{title:"店员会主动推荐？",options:[["经常","RESULT_BASKET"],["偶尔","RESULT_BASKET"],["基本不会","RESULT_BASKET"]]},
stockout_1:{title:"最常缺什么？",options:[["蔬菜","stockout_2"],["水果","stockout_2"],["蛋奶","stockout_2"],["肉类","stockout_2"],["都可能","stockout_2"]]},stockout_2:{title:"怎么决定进多少？",options:[["凭经验","stockout_3"],["看昨天","stockout_3"],["看库存","stockout_3"],["供应商建议","stockout_3"],["有系统","stockout_3"]]},stockout_3:{title:"缺货会记录？",options:[["会","RESULT_STOCKOUT"],["不会","RESULT_STOCKOUT"]]},
waste_1:{title:"剩得最多？",options:[["蔬菜","waste_2"],["水果","waste_2"],["蛋奶","waste_2"],["肉类","waste_2"],["都不少","waste_2"]]},waste_2:{title:"怎么决定进多少？",options:[["凭经验","waste_3"],["看昨天","waste_3"],["看库存","waste_3"],["供应商建议","waste_3"],["有系统","waste_3"]]},waste_3:{title:"卖不完怎么办？",options:[["第二天卖","RESULT_WASTE"],["晚上打折","RESULT_WASTE"],["送人","RESULT_WASTE"],["扔掉","RESULT_WASTE"],["看情况","RESULT_WASTE"]]},
repeat_1:{title:"老客有联系方式？",options:[["大部分有","repeat_2"],["少部分有","repeat_2"],["基本没有","repeat_2"]]},repeat_2:{title:"会主动联系老客？",options:[["经常","repeat_3"],["偶尔","repeat_3"],["基本不会","repeat_3"]]},repeat_3:{title:"知道多久会再买？",options:[["大概知道","RESULT_REPEAT"],["不知道","RESULT_REPEAT"]]},
profit_1:{title:"知道哪些最赚钱？",options:[["知道","profit_2"],["大概知道","profit_2"],["不知道","profit_2"]]},profit_2:{title:"会记录损耗？",options:[["每天记","profit_3"],["偶尔记","profit_3"],["不记","profit_3"]]},profit_3:{title:"会按商品看毛利？",options:[["会","RESULT_PROFIT"],["不会","RESULT_PROFIT"]]},
unclear_1:{title:"最近最明显？",options:[["营业额下降","unclear_2"],["货越囤越多","unclear_2"],["很忙没利润","unclear_2"],["客人越来越少","unclear_2"],["都不明显","unclear_2"]]},unclear_2:{title:"每天看经营数据？",options:[["会","unclear_3"],["偶尔","unclear_3"],["基本不看","unclear_3"]]},unclear_3:{title:"最常凭什么判断？",options:[["经验","RESULT_UNCLEAR"],["收银数据","RESULT_UNCLEAR"],["库存","RESULT_UNCLEAR"],["感觉","RESULT_UNCLEAR"]]}
};
const RESULTS={RESULT_TRAFFIC:{title:"先解决客流来源",reason:"先知道客人从哪来、哪种来源会成交。",first:"先做：7天客流记录",second:"再做：来源成交对比",stop:"暂缓：盲目加广告"},RESULT_BASKET:{title:"先提高每单价值",reason:"客人已经进店，先让同一批客人买得更合理。",first:"先做：高频商品搭配",second:"再做：店员推荐",stop:"暂缓：继续扩SKU"},RESULT_STOCKOUT:{title:"先修补货判断",reason:"把库存、销量和缺货记录连起来。",first:"先做：7天进销存",second:"再做：缺货排行",stop:"暂缓：凭感觉加量"},RESULT_WASTE:{title:"先降库存损耗",reason:"先看进多少、卖多少、剩多少。",first:"先做：7天损耗记录",second:"再做：补货建议",stop:"暂缓：增加进货"},RESULT_REPEAT:{title:"先做老客复购",reason:"先知道谁多久没来，再决定怎么联系。",first:"先做：老客购买周期",second:"再做：到期提醒",stop:"暂缓：群发优惠"},RESULT_PROFIT:{title:"先看真实利润",reason:"先拆商品毛利和损耗。",first:"先做：Top20商品毛利",second:"再做：损耗占比",stop:"暂缓：只追营业额"},RESULT_UNCLEAR:{title:"先把生意看清",reason:"关键经营动作主要靠感觉，先建立最小记录。",first:"先做：7天经营记录",second:"再做：找最大漏点",stop:"暂缓：上复杂系统"}};
const screen=document.getElementById('screen'),progressBar=document.getElementById('progressBar'),stepText=document.getElementById('stepText');
function branchFor(k){return k==='traffic'?'traffic_1':k==='basket'?'basket_1':k==='stockout'?'stockout_1':k==='waste'?'waste_1':k==='repeat'?'repeat_1':k==='profit'?'profit_1':'unclear_1'}
function renderQuestion(id){const q=FLOW[id],idx=state.history.length+1,total=4;stepText.textContent=`${Math.min(idx,total)} / ${total}`;progressBar.style.width=`${Math.min(idx,total)/total*100}%`;screen.innerHTML=`${state.history.length?'<button class="back" onclick="goBack()">← 返回</button>':''}<div class="kicker">门店经营体检</div><h1>${q.title}</h1><div class="options">${q.options.map(([label,next])=>`<button class="option" onclick="choose('${id}','${label}','${next}')"><span>${label}</span><span class="chev">›</span></button>`).join('')}</div><div class="footer-space"></div>`}
window.choose=function(id,label,next){state.history.push(id);state.answers[id]=label;if(id==='start'){state.branch=next;renderQuestion(branchFor(next));return}if(next.startsWith('RESULT_'))renderResult(next);else renderQuestion(next)};
window.goBack=function(){if(!state.history.length)return;const prev=state.history.pop();delete state.answers[prev];if(prev==='start'){state.branch=null;renderQuestion('start')}else renderQuestion(prev)};
function renderResult(key){const r=RESULTS[key];state.resultKey=key;stepText.textContent='完成';progressBar.style.width='100%';screen.innerHTML=`<div class="kicker">你的第一优先</div><div class="result-card"><div class="result-label">建议先解决</div><div class="result-title">${r.title}</div><p class="result-reason">${r.reason}</p><div class="priority"><div class="pill">${r.first}</div><div class="pill secondary">${r.second}</div><div class="pill stop">${r.stop}</div></div></div><div class="actions"><button class="primary" onclick="startObserve()">开始7天观察</button><button class="secondary-btn" onclick="restart()">重新体检</button></div><div class="note">首版只做方向判断。</div>`}
window.restart=function(){localStorage.removeItem('fde_observations_v01');state.history=[];state.answers={};state.branch=null;state.resultKey=null;renderQuestion('start')};
window.startObserve=function(){stepText.textContent='7天观察';progressBar.style.width='100%';renderObserve()};
function getObs(){try{return JSON.parse(localStorage.getItem('fde_observations_v01')||'[]')}catch(e){return[]}}function saveObs(rows){localStorage.setItem('fde_observations_v01',JSON.stringify(rows))}
function renderObserve(){const rows=getObs(),day=Math.min(rows.length+1,7),branch=state.branch||'unclear';const labels={waste:['今日营业额','剩货最多','损耗金额','缺货最多'],stockout:['今日营业额','缺货最多','缺货时间','剩货最多'],traffic:['今日营业额','进店人数','成交单数','主要客源'],basket:['今日营业额','成交单数','客单价','卖得最好'],repeat:['今日营业额','老客单数','新客单数','主动联系人数'],profit:['今日营业额','采购金额','损耗金额','感觉最赚钱'],unclear:['今日营业额','最明显问题','今天缺货','今天损耗']}[branch];screen.innerHTML=`<button class="back" onclick="renderCurrentResult()">← 返回结果</button><div class="kicker">第 ${day} 天 / 7天</div><h1>今天记一下</h1><p class="desc">30秒就够。</p>${labels.map((x,i)=>`<div class="field"><label>${x}</label><input id="f${i+1}" placeholder="填写"></div>`).join('')}<button class="primary" style="width:100%" onclick="saveToday()">${rows.length>=6?'完成7天':'保存今天'}</button>${rows.length?`<div class="obs-list"><div class="small-head">已记录 ${rows.length} 天</div>${rows.slice().reverse().map((r,i)=>`<div class="obs-item"><strong>第 ${rows.length-i} 天</strong><br>${r.values.map((v,j)=>`${labels[j]}：${v||'—'}`).join('<br>')}</div>`).join('')}</div>`:''}<div class="footer-space"></div>`}
window.saveToday=function(){const vals=['f1','f2','f3','f4'].map(id=>document.getElementById(id).value.trim());if(vals.every(v=>!v)){alert('至少填一项');return}const rows=getObs();if(rows.length>=7)return;rows.push({date:new Date().toISOString(),values:vals,branch:state.branch});saveObs(rows);if(rows.length>=7)renderSevenDayDone();else renderObserve()};
function renderSevenDayDone(){screen.innerHTML=`<div class="kicker">7天完成</div><div class="result-card"><div class="result-label">下一步</div><div class="result-title">现在可以看真实问题了</div><p class="result-reason">已经从“凭感觉”走到“有记录”。下一步基于这7天数据找最大异常。</p><div class="priority"><div class="pill">先做：整理7天记录</div><div class="pill secondary">再做：找最大异常</div><div class="pill stop">暂缓：复杂SaaS</div></div></div><div class="actions"><button class="secondary-btn" onclick="restart()">重新开始</button></div><div class="note">数据只保存在当前浏览器。</div>`}
window.renderCurrentResult=function(){renderResult(state.resultKey||'RESULT_UNCLEAR')};renderQuestion('start');
</script>
</body>
</html>
